name: ci
on:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'assets/**', '.github/workflows/**', 'tests/**']
  pull_request:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'assets/**', '.github/workflows/**', 'tests/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: rustfmt --edition 2021 --check src/*.rs tests/fake_wacli.rs
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-lock
          path: Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: WazigRust-windows-x64
          path: target/release/wazig-rust.exe

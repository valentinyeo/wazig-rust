name: bench
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'assets/**', '.github/workflows/**', 'tests/**']
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Build opt-level=3 comparison candidate
        shell: pwsh
        run: |
          Copy-Item target/release/wazig-rust.exe target/release/wazig-rust-z.exe
          $env:CARGO_PROFILE_RELEASE_OPT_LEVEL = '3'
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'opt-level=3 build failed' }
          Move-Item target/release/wazig-rust.exe target/release/wazig-rust-3.exe -Force
          Move-Item target/release/wazig-rust-z.exe target/release/wazig-rust.exe -Force
      - name: Build native wacli contract fixture
        run: rustc --edition 2021 -O tests/fake_wacli.rs -o target/release/fake-wacli.exe
      - name: Verify fake WhatsApp and compare native apps
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/bench.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-whatsapp-bench
          path: bench-evidence/

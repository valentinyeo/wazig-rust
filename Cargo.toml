[package]
name = "wazig-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Win32 WhatsApp client using Direct2D and DirectWrite"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Foundation_Numerics", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging", "Win32_Networking_WinHttp", "Win32_Security",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO",
  "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
